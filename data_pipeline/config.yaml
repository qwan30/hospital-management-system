# Synthea-to-HMS Data Ingestion Pipeline Configuration
# All values can be overridden via environment variables or CLI flags.

synthea:
  version: "v3.4.1"
  jar_url: "https://github.com/synthetichealth/synthea/releases/download/{version}/synthea-with-dependencies.jar"
  jar_path: "./synthea/synthea-with-dependencies.jar"

hms:
  patients: 500
  staff_users: 40
  departments: 12
  appointments_per_patient_min: 1
  appointments_per_patient_max: 8
  future_slot_days: 30
  past_slot_days: 14
  slot_duration_minutes: 30
  reference_date: ""
  demo_password: "Demo@1234"
  patient_portal_password: "Patient@1234"
  staff_email_domain: "hospital.vn"
  patient_email_domain: "example.com"
  cancellation_rate: 0.05
  invoice_paid_rate: 0.70
  invoice_unpaid_rate: 0.25

  service_pricing:
    kham_tong_quat: 150000
    kham_chuyen_khoa: 250000
    xet_nghiem_mau: 120000
    xet_nghiem_nuoc_tieu: 80000
    dien_tim: 180000
    sieu_am: 250000
    noi_soi: 350000
    x_quang: 200000
    ct_scan: 800000
    mri: 1500000

  disclaimer: |
    -- ============================================================================
    -- DEMO / SYNTHETIC DATA — NOT FOR PRODUCTION USE
    -- Generated by Synthea-to-HMS Data Ingestion Pipeline
    -- Source: Synthea (synthetichealth/synthea)
    -- All patient identities are FABRICATED. No real PHI.
    -- CCCD numbers are randomly generated 12-digit strings.
    -- Phone numbers use fake VN prefixes.
    -- Clinical data is synthetic and may not reflect real medical practice.
    -- ============================================================================

