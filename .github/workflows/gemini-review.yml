name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, master]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GEMINI_MODEL_LIGHT: ${{ vars.GEMINI_MODEL_LIGHT || 'gemini-2.5-flash-lite' }}
  GEMINI_MODEL_STRONG: ${{ vars.GEMINI_MODEL_STRONG || 'gemini-2.5-flash' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REPO: ${{ github.repository }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  PR_BODY: ${{ github.event.pull_request.body }}
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  review:
    name: Gemini AI Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run self-checks
        run: python3 .github/scripts/test_review_bot.py

      - name: Prepare diff
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/review_bot.py prepare

      - name: Run AI passes & verification
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GEMINI_AI_KEY: ${{ secrets.GEMINI_AI_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MODEL: ${{ vars.GEMINI_MODEL_LIGHT || 'gemini-2.5-flash-lite' }}
          FALLBACK_MODEL: ${{ vars.GEMINI_MODEL_STRONG || 'gemini-2.5-flash' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Running CLAUDE.md compliance pass..."
          python3 .github/scripts/review_bot.py pass --pass-name claude-md
          sleep 10
          
          echo "Running Bug scan pass..."
          python3 .github/scripts/review_bot.py pass --pass-name bug-scan
          sleep 10
          
          echo "Running Git history pass..."
          python3 .github/scripts/review_bot.py pass --pass-name git-blame
          sleep 10
          
          echo "Running Related past PRs pass..."
          python3 .github/scripts/review_bot.py pass --pass-name pr-history
          sleep 10
          
          echo "Running Code comment compliance pass..."
          python3 .github/scripts/review_bot.py pass --pass-name code-comment
          sleep 10
          
          echo "Running Verification and Post..."
          export MODEL="${{ vars.GEMINI_MODEL_STRONG || 'gemini-2.5-flash' }}"
          python3 .github/scripts/review_bot.py verify
